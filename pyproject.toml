[tool.poetry]
name = "voice-booking-ai-agent"
version = "0.1.0"
description = "A voice booking AI agent for sports facilities"
authors = ["kyungho-song <your_email@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.111.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
sqlalchemy = "^1.4.52"
psycopg2-binary = "^2.9.9"
pydantic = {version = "^1.10.17", extras = ["dotenv"]}
google-generativeai = "^0.7.2"
google-api-python-client = "^2.136.0"
google-auth = "^2.30.0"
twilio = "^9.2.3"

[tool.poetry.dev-dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.backend"
